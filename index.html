    <meta property="og:title" content="MDCraft — Markdown 编辑器" />
    <meta property="og:description" content="所见即所得 Markdown 编辑器，支持双模式、实时预览、公式渲染与多主题切换。" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <script>
      // 外观在首帧前应用：启动画面和后续界面都不会先闪一下默认配色
      // 主题模式（浅色/深色）与配色方案是两个维度，与 dbx 一致
      (function () {
        try {
          var mode = localStorage.getItem("mdcraft:theme-mode");
          var palette = localStorage.getItem("mdcraft:theme-palette");
          if (mode !== "light" && mode !== "dark") {
            // 旧配置里的“跟随系统”与首次启动：按系统偏好落成固定模式
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.dataset.palette = palette || "pearl";
        } catch (e) {
          document.documentElement.dataset.themeMode = "light";
          document.documentElement.dataset.palette = "pearl";
        }
      })();
    </script>
    <style>
      /* ==========================================================================
         1. 启动遮罩配色：按深浅两套走（配色方案的色板在应用层接管）
         ========================================================================== */
      :root {
        color-scheme: light;
        --boot-bg: #ffffff;
        --boot-bg-subtle: #f6f8fa;
        --boot-fg: #1f2328;
        --boot-fg-muted: #656d76;
        --boot-accent: #0969da;
        --boot-accent-glow: rgba(9, 105, 218, 0.12);
        --boot-track: rgba(31, 35, 40, 0.08);
        --boot-card-border: rgba(31, 35, 40, 0.08);
        --boot-logo-bg: linear-gradient(180deg, #ffffff 0%, #f6f8fa 100%);
        --boot-logo-shadow:
          0 1px 2px rgba(31, 35, 40, 0.06),
          0 8px 24px -4px rgba(31, 35, 40, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --boot-dot: rgba(31, 35, 40, 0.05);
        --boot-title-a: #2563eb;
        --boot-title-b: #4f46e5;
      }

      html[data-theme-mode="dark"] {
        color-scheme: dark;
        --boot-bg: #1e2227; /* 比纯 #363b40 更深邃高级，同时与编辑器暗色自然过渡 */
        --boot-bg-subtle: #252a30;
        --boot-fg: #e6edf3;
        --boot-fg-muted: #8b949e;
        --boot-accent: #4493f8;
        --boot-accent-glow: rgba(68, 147, 248, 0.16);
        --boot-track: rgba(240, 246, 252, 0.1);
        --boot-card-border: rgba(240, 246, 252, 0.1);
        --boot-logo-bg: linear-gradient(180deg, #2d333b 0%, #22272e 100%);
        --boot-logo-shadow:
          0 2px 4px rgba(0, 0, 0, 0.35),
          0 12px 28px -4px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        --boot-dot: rgba(255, 255, 255, 0.04);
        --boot-title-a: #60a5fa;
        --boot-title-b: #818cf8;
      }

      /* ==========================================================================
         2. 全局容器与启动遮罩
         ========================================================================== */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--boot-bg);
        /* 顶部微环境光晕，塑造桌面级空间纵深感 */
        background-image: radial-gradient(
          circle 520px at 50% 42%,
          var(--boot-accent-glow),
          transparent 75%
        );
        transition:
          opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }

      /* 中心精密微点阵：使用径向遮罩仅在中心区域若隐若现 */
      #boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(var(--boot-dot) 1px, transparent 1px);
        background-size: 20px 20px;
        mask-image: radial-gradient(circle 320px at 50% 50%, #000 15%, transparent 85%);
        -webkit-mask-image: radial-gradient(circle 320px at 50% 50%, #000 15%, transparent 85%);
        pointer-events: none;
      }

      /* 启动结束退场态（保持原有 .is-done 契约） */
      #boot-splash.is-done {
        opacity: 0;
        transform: scale(0.985);
        filter: blur(4px);
        pointer-events: none;
      }

      /* 主界面内容淡入：与启动遮罩淡出交叉进行（Apple 式启动衔接） */
      #root .app-enter {
        animation: app-fade-in 0.36s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes app-fade-in {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ==========================================================================
         3. 启动核心视觉卡片（Brand & Precision Loader）
         ========================================================================== */
      .boot-card {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 240px;
        color: var(--boot-fg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter",
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        user-select: none;
        animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes card-appear {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .boot-brand {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
      }

      .boot-logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: block;
      }

      .boot-title-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
      }

      .boot-title {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.15;
        background: linear-gradient(90deg, var(--boot-title-a), var(--boot-title-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .boot-subtitle {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--boot-fg-muted);
        opacity: 0.75;
      }

      /* ==========================================================================
         4. 精密光学进度条（取代原本繁杂的多元素弹跳动画）
         ========================================================================== */
      .loading-core {
        margin-top: 28px;
        margin-bottom: 12px;
        width: 148px;
        height: 2px;
        background: var(--boot-track);
        border-radius: 999px;
        position: relative;
        overflow: hidden;
      }

      .loading-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--boot-accent) 50%,
          transparent 100%
        );
        animation: beam-sweep 1.45s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes beam-sweep {
        0% {
          transform: translateX(-115%);
        }
        100% {
          transform: translateX(235%);
        }
      }

      .boot-hint {
        font-size: 11.5px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: var(--boot-fg-muted);
        animation: text-breath 2.2s ease-in-out infinite alternate;
      }

      @keyframes text-breath {
        0% {
          opacity: 0.5;
        }
        100% {
          opacity: 0.9;
        }
      }

      /* 无障碍：减弱动态效果偏好支持 */
      @media (prefers-reduced-motion: reduce) {
        .boot-card,
        .loading-beam,
        .boot-hint {
          animation: none;
        }
        .loading-beam {
          width: 100%;
          opacity: 0.45;
        }
      }
    </style>
